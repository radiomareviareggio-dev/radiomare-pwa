<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Radio Mare</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b2a3a">

  <style>
    body {
      margin: 0;
      background: #0b2a3a;
      color: white;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    header {
      padding: 30px 20px;
    }
    audio {
      width: 100%;
      margin-top: 20px;
    }
    button {
      margin-top: 15px;
      padding: 14px 22px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      background: #f7941d;
      color: #000;
      cursor: pointer;
    }
    #track {
      margin-top: 15px;
      color: #ffd18b;
    }
  </style>
</head>

<body>
  <header>
    <h1>🌊 Radio Mare</h1>
    <p>quella col delfino blu</p>

    <audio id="player" controls>
      <source src="https://hello.citrus3.com:9016/stream" type="audio/mpeg">
    </audio>

    <br>
    <button onclick="document.getElementById('player').play()">▶️ Ascolta</button>

    <div id="track">🎶 In onda…</div>
  </header>

  <script>
    async function aggiornaTitolo() {
      try {
        const r = await fetch("https://hello.citrus3.com:9016/status-json.xsl");
        const j = await r.json();
        const s = j.icestats.source;
        document.getElementById("track").innerText =
          "🎶 " + (s.title || s.streamtitle || "Radio Mare");
      } catch (e) {}
    }

    aggiornaTitolo();
    setInterval(aggiornaTitolo, 15000);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
